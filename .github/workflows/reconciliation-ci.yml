name: Python reconciliation CI

on:
  push:
    branches: [master]
    paths:
      - "portfolio/python-excel-data-reconciliation-demo/**"
      - ".github/workflows/reconciliation-ci.yml"
  pull_request:
    paths:
      - "portfolio/python-excel-data-reconciliation-demo/**"
      - ".github/workflows/reconciliation-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/python-excel-data-reconciliation-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python examples/build_demo.py
