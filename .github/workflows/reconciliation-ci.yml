name: Python reconciliation CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "LIMITATIONS.md"
      - "SECURITY.md"
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/reconciliation-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
      - "LIMITATIONS.md"
      - "SECURITY.md"
      - "pyproject.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/reconciliation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: excel-reconciliation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Static type analysis
        run: mypy src/recon
      - name: Tests
        run: pytest -q
      - name: Reproducible demo report
        run: python examples/build_demo.py
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Reproducible package build
        run: python -m build
      - name: Upload recruiter evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reconciliation-verification
          path: |
            reconciliation_report.xlsx
            dist/
          if-no-files-found: warn
          retention-days: 14
